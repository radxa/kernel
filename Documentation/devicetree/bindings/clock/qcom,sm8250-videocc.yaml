%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,sm8250-videocc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Video Clock & Reset Controller

maintainers:
  - Taniya Das <quic_tdas@quicinc.com>

description: |
  Qualcomm video clock control module provides the clocks, resets and power
  domains on Qualcomm SoCs.

  See also::
    include/dt-bindings/clock/qcom,videocc-sm8250.h

properties:
  compatible:
    oneOf:
      - enum:
          - qcom,sm8250-videocc

  clocks:
    items:
      - description: AHB
      - description: Board XO source
      - description: Board active XO source

  clock-names:
    items:
      - const: iface
      - const: bi_tcxo
      - const: bi_tcxo_ao

  power-domains:
    items:
      - description:
          A phandle and PM domain specifier for the MMCX power domain.
      - description:
          A phandle and PM domain specifier for the MX power domain.

  required-opps:
    items:
      - description:
          A phandle to an OPP node describing required MMCX performance point.
      - description:
          A phandle to an OPP node describing required MX performance point.

required:
  - compatible
  - clocks
  - clock-names
  - '#power-domain-cells'
  - power-domains
  - required-opps

allOf:
  - $ref: qcom,gcc.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmh.h>
    #include <dt-bindings/power/qcom,rpmhpd.h>
    clock-controller@ab00000 {
      compatible = "qcom,sm8250-videocc";
      reg = <0x0ab00000 0x10000>;
      clocks = <&gcc_gcc_video_ahb_clk>,
               <&rpmhcc RPMH_CXO_CLK>,
               <&rpmhcc RPMH_CXO_CLK_A>;
      clock-names = "iface",
                    "bi_tcxo",
                    "bi_tcxo_ao";
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
      power-domains = <&rpmhpd RPMHPD_MMCX>,
                      <&rpmhpd RPMHPD_MX>;
      required-opps = <&rpmhpd_opp_low_svs>,
                      <&rpmhpd_opp_low_svs>;
    };
...
